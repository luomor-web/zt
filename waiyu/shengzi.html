<script>
(function () {
    var params = new URLSearchParams(location.search);
    var lang = params.get('lang') || 'ko';
    var allowed = ['ko','ja','vi','ru','es','fr','de','en'];
    if (allowed.indexOf(lang) === -1) lang = 'ko';

    // 当前语种 tab 高亮
    document.querySelectorAll('#lang-tabs a').forEach(function (a) {
        if (a.dataset.lang === lang) a.classList.add('active');
    });

    var dataCache = null;
    var contentEl = document.getElementById('content');

    fetch('../data/guoji/' + lang + '.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            dataCache = data;
            document.getElementById('lang-name').textContent = data.name;
            document.title = data.name + '生字表 - 常用词汇带中文释义 - 烙馍网';
            render(data, '');
        })
        .catch(function () {
            contentEl.innerHTML = '<p style="color:#e74c3c;">数据加载失败，请刷新重试。</p>';
        });

    function render(data, filter) {
        var html = '';

        if (!filter) {
            html += '<div class="section-title">🔤 字母表（' + data.letters.length + ' 个）</div>';
            html += '<div class="letter-list">';
            data.letters.forEach(function (l) {
                html += '<div class="letter-item">' + escapeHtml(l) + '</div>';
            });
            html += '</div>';
        }

        var words = data.words.filter(function (w) {
            return !filter || w.w.toLowerCase().indexOf(filter) !== -1 || w.zh.indexOf(filter) !== -1;
        });
        html += '<div class="section-title">📝 常用单词（' + words.length + ' 个）</div>';
        html += '<table class="word-table">';
        words.forEach(function (w) {
            html += '<tr><td>' + escapeHtml(w.w) + '</td><td>' + escapeHtml(w.zh) + '</td></tr>';
        });
        html += '</table>';

        if (!filter) {
            html += '<div class="section-title">💬 常用句子（' + data.sentences.length + ' 句）</div>';
            data.sentences.forEach(function (s) {
                html += '<div class="sentence-item"><div class="t">' + escapeHtml(s.t) + '</div><div class="z">' + escapeHtml(s.zh) + '</div></div>';
            });
        }

        contentEl.innerHTML = html;
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('search').addEventListener('input', function () {
        var q = this.value.trim().toLowerCase();
        if (dataCache) render(dataCache, q);
    });
})();
</script>
